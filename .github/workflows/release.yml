name: Release

# A version tag (v1.4.0.2) builds the universal app with scripts/release.sh: Developer ID
# signature, notarized and stapled app and DMG, EdDSA-signed appcast, and a GitHub release with
# the DMG and appcast.xml. Installed copies update from
# https://github.com/kuzaxak/Nook/releases/latest/download/appcast.xml, so the newest release is
# the update everyone gets.
#
# The job runs on the self-hosted runner labelled nook-release, a Mac where the runner's
# LaunchAgent runs as the user's own account; its job-started hook (scripts/runner/
# job-started-hook.sh) refuses every job but this workflow's tag pushes and manual runs.
# scripts/ci-keychain.sh keeps the signing identity and the notarytool profile in a temporary
# keychain and takes it off the user's keychain search list afterwards.
#
# Repository secrets (scripts/setup-release-secrets.sh stores them):
#   APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD  Developer ID Application identity
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID       notarization
#   SPARKLE_SIGNING_KEY                                       EdDSA private key (generate_keys -x)
#   NOOK_PROVISIONING_PROFILE                                 Developer ID provisioning profile
#                                                             (base64) for iCloud sync of spaces

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.4.0.2; the release is tagged v<version> at this commit
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, nook-release]
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "Not a version: $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci-keychain.sh setup

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/ci-keychain.sh notary

      - name: Ensure Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal Toolchain already present or download unsupported, continuing"

      - name: Refresh bundled filter lists
        run: ./scripts/refresh-filter-lists.sh

      - name: Build, notarize and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_SIGNING_KEY }}
          NOOK_PROVISIONING_PROFILE: ${{ secrets.NOOK_PROVISIONING_PROFILE }}
        run: caffeinate -i scripts/release.sh "$VERSION" --publish

      - name: Remove temporary keychain
        if: always()
        run: scripts/ci-keychain.sh cleanup
